name: X04 Codacy diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  codacy-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch public Codacy PR findings
        shell: bash
        run: |
          set -Eeuo pipefail
          url='https://api.codacy.com/api/v3/analysis/organizations/gh/wsg138/repositories/EnthusiaCommend/pull-requests/12/issues?limit=1000'
          for attempt in $(seq 1 36); do
            curl --fail --silent --show-error --location --header 'Accept: application/json' "$url" -o codacy.json
            total="$(jq -r '.pagination.total // 0' codacy.json)"
            if [[ "$total" =~ ^[0-9]+$ ]] && (( total > 0 )); then
              jq '{pagination, count:(.data|length), issues:[.data[] | {id, status, filePath, lineNumber, message, patternInfo, toolInfo}]}' codacy.json
              exit 0
            fi
            sleep 5
          done
          echo '::error::Codacy PR analysis did not expose findings before diagnostic timeout'
          cat codacy.json
          exit 1
