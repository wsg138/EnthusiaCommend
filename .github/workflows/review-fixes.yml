name: Apply review fixes

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'feature/rep-system-v2-mainline' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rep-system-v2-mainline
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Apply focused review fixes
        run: |
          python3 .review-fixes/patch_gui.py
          python3 .review-fixes/patch_plan.py

      - name: Verify
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Publish source fixes
        run: |
          if git diff --quiet -- \
            src/main/java/org/enthusia/rep/gui/RepGuiManager.java \
            src/main/java/org/enthusia/rep/command/CommendCommand.java \
            src/main/java/org/enthusia/rep/rep/RepService.java \
            src/main/java/org/enthusia/rep/analytics/ReputationAnalyticsService.java \
            src/main/java/org/enthusia/rep/integration/plan/PlanReputationDataExtension.java; then
            echo "No source changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/main/java/org/enthusia/rep/gui/RepGuiManager.java \
            src/main/java/org/enthusia/rep/command/CommendCommand.java \
            src/main/java/org/enthusia/rep/rep/RepService.java \
            src/main/java/org/enthusia/rep/analytics/ReputationAnalyticsService.java \
            src/main/java/org/enthusia/rep/integration/plan/PlanReputationDataExtension.java
          git commit -m "fix: align weighted displays, categories, and rep history"
          git push origin HEAD:feature/rep-system-v2-mainline
