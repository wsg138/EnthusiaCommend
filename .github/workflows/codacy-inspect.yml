name: Inspect Java static analysis
on:
  pull_request:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run PMD report
        run: |
          mvn --batch-mode --no-transfer-progress org.apache.maven.plugins:maven-pmd-plugin:3.26.0:pmd
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          path = Path('target/pmd.xml')
          root = ET.parse(path).getroot()
          namespace = {'p': 'http://pmd.sourceforge.net/report/2.0.0'}
          count = 0
          for file_node in root.findall('p:file', namespace):
              for violation in file_node.findall('p:violation', namespace):
                  count += 1
                  print(f"PMD|{file_node.attrib['name']}:{violation.attrib.get('beginline')}|"
                        f"{violation.attrib.get('priority')}|{violation.attrib.get('rule')}|"
                        f"{(violation.text or '').strip()}")
          print(f'PMD_TOTAL={count}')
          PY
      - name: Run SpotBugs report
        run: |
          mvn --batch-mode --no-transfer-progress com.github.spotbugs:spotbugs-maven-plugin:4.8.6.6:spotbugs
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          path = Path('target/spotbugsXml.xml')
          root = ET.parse(path).getroot()
          bugs = root.findall('BugInstance')
          for bug in bugs:
              source = bug.find('.//SourceLine')
              location = 'unknown'
              if source is not None:
                  location = f"{source.attrib.get('sourcepath', 'unknown')}:{source.attrib.get('start', '?')}"
              message = bug.findtext('LongMessage') or bug.findtext('ShortMessage') or ''
              print(f"SPOTBUGS|{location}|{bug.attrib.get('priority')}|{bug.attrib.get('type')}|{message}")
          print(f'SPOTBUGS_TOTAL={len(bugs)}')
          PY
