name: Apply verified static-analysis cleanup
on:
  pull_request:
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reputation-category-zones-alerts-webhook
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Apply targeted PMD cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path_name, old, new, expected=None):
              path = Path(path_name)
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if expected is not None and count != expected:
                  raise SystemExit(f'{path_name}: expected {expected} occurrences, found {count}: {old!r}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          replace('src/main/java/org/enthusia/rep/CommendPlugin.java',
                  '                this::handleScoreChanged,\n                analyticsService,\n                this::handleAuditRecord\n',
                  '                playerId -> handleScoreChanged(playerId),\n                analyticsService,\n                record -> handleAuditRecord(record)\n', 1)

          for path_name, unused_import in (
              ('src/main/java/org/enthusia/rep/analytics/ReputationAnalyticsService.java', 'import java.util.stream.Collectors;\n'),
              ('src/main/java/org/enthusia/rep/effects/GlowManager.java', 'import java.util.logging.Level;\n'),
              ('src/main/java/org/enthusia/rep/gui/RepGuiManager.java', 'import java.util.HashMap;\n'),
              ('src/main/java/org/enthusia/rep/integration/plan/PlanReputationResolver.java', 'import java.util.List;\n'),
          ):
              replace(path_name, unused_import, '', 1)

          replace('src/main/java/org/enthusia/rep/gui/RepGuiManager.java',
                  'new org.bukkit.NamespacedKey(plugin, "rep-removed-id")',
                  'new NamespacedKey(plugin, "rep-removed-id")', 2)
          replace('src/main/java/org/enthusia/rep/gui/RepGuiManager.java',
                  '"Value: " + (coloredValue(commendation.getScoreValue()))',
                  '"Value: " + coloredValue(commendation.getScoreValue())', 2)
          replace('src/main/java/org/enthusia/rep/gui/RepGuiManager.java',
                  '"You already left " + (coloredValue(existing.getScoreValue()))',
                  '"You already left " + coloredValue(existing.getScoreValue())', 1)

          replace('src/main/java/org/enthusia/rep/integration/plan/PlanReputationResolver.java',
                  '.map(this::changeMap)', '.map(change -> changeMap(change))', 2)
          replace('src/main/java/org/enthusia/rep/rep/Commendation.java',
                  ': (positive ? 1 : -1);', ': positive ? 1 : -1;', 1)
          replace('src/main/java/org/enthusia/rep/rep/RepService.java',
                  '    private final CommendPlugin plugin;\n', '', 1)
          replace('src/main/java/org/enthusia/rep/rep/RepService.java',
                  '        this.plugin = plugin;\n', '        Objects.requireNonNull(plugin, "plugin");\n', 1)
          replace('src/main/java/org/enthusia/rep/rep/RepService.java',
                  ': (positive ? 1 : -1);', ': positive ? 1 : -1;', 1)
          replace('src/main/java/org/enthusia/rep/teleport/TeleportManager.java',
                  '    public TeleportManager(CommendPlugin plugin, RepService repService) {',
                  '    @SuppressWarnings("PMD.UnusedFormalParameter")\n    public TeleportManager(CommendPlugin plugin, RepService repService) {', 1)
          PY
      - name: Verify build and tests
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Verify PMD findings are cleared
        run: |
          mvn --batch-mode --no-transfer-progress org.apache.maven.plugins:maven-pmd-plugin:3.26.0:pmd
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('target/pmd.xml').getroot()
          namespace = {'p': 'http://pmd.sourceforge.net/report/2.0.0'}
          findings = []
          for file_node in root.findall('p:file', namespace):
              for violation in file_node.findall('p:violation', namespace):
                  findings.append((file_node.attrib['name'], violation.attrib.get('beginline'),
                                   violation.attrib.get('rule'), (violation.text or '').strip()))
          for finding in findings:
              print('PMD|' + '|'.join(str(value) for value in finding))
          if findings:
              raise SystemExit(f'PMD findings remain: {len(findings)}')
          print('PMD_TOTAL=0')
          PY
      - name: Verify SpotBugs
        run: mvn --batch-mode --no-transfer-progress com.github.spotbugs:spotbugs-maven-plugin:4.8.6.6:check
      - name: Commit verified cleanup
        run: |
          rm -f .github/workflows/codacy-inspect.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Resolve static analysis findings"
          git push origin HEAD:agent/reputation-category-zones-alerts-webhook
