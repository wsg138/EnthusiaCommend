name: Apply and verify reputation improvement
on:
  pull_request:
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reputation-category-zones-alerts-webhook
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Apply reviewed source patch
        run: |
          cat .automation/patch.* | base64 -d | gzip -d > /tmp/reputation.patch
          patch -p1 < /tmp/reputation.patch
          python - <<'PY'
          from pathlib import Path
          path = Path('src/main/java/org/enthusia/rep/gui/RepGuiManager.java')
          text = path.read_text(encoding='utf-8')
          old = 'RepCategoryGuiSupport.total(repService, targetId, selected, "Player total")'
          new = 'RepCategoryGuiSupport.total(repService, targetId, selected)'
          if old not in text:
              raise SystemExit('Expected profile total call was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm -rf .automation .automation-trigger
          rm -f .github/workflows/source-export.yml .github/workflows/apply-reputation-improvement.yml
      - name: Verify exact final tree
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Commit verified implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Improve reputation category views and alerts"
          git push origin HEAD:agent/reputation-category-zones-alerts-webhook
