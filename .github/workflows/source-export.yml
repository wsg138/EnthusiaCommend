name: Temporary source export
on:
  push:
    branches: [agent/reputation-category-zones-alerts-webhook]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: source-export
          path: |
            .github
            README.md
            pom.xml
            player-head-gui-reference.txt
            src
          if-no-files-found: error
