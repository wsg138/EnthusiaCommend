name: Apply final fixes

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'feature/rep-system-v2-mainline' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rep-system-v2-mainline
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Apply final service and Discord fixes
        run: python3 .final-fixes/patch.py

      - name: Verify
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Publish verified fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/main/java/org/enthusia/rep/rep/RepRules.java \
            src/main/java/org/enthusia/rep/rep/RepService.java \
            src/main/java/org/enthusia/rep/discord/DiscordWebhookService.java \
            src/test/java/org/enthusia/rep/rep/RepRulesTest.java \
            src/test/java/org/enthusia/rep/discord/DiscordWebhookServiceTest.java
          git commit -m "fix: harden category validation and Discord delivery"
          git push origin HEAD:feature/rep-system-v2-mainline
