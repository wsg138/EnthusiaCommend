name: X04 final static fix

on:
  push:
    branches:
      - package/es-x04-commend-provider

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: package/es-x04-commend-provider
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Replace removed-log slot literals with existing constants
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/main/java/org/enthusia/rep/gui/RepGuiManager.java')
          text = path.read_text()
          old = '''    private void handleRemovedLogClick(Player player, RemovedLogHolder holder, int slot, ItemStack clicked) {
              if (slot == 45) {
                  openRemovedLog(player, holder.page() - 1);
                  return;
              }
              if (slot == 53) {
                  openRemovedLog(player, holder.page() + 1);
                  return;
              }
          '''
          new = '''    private void handleRemovedLogClick(Player player, RemovedLogHolder holder, int slot, ItemStack clicked) {
              if (slot == PREVIOUS_PAGE_SLOT) {
                  openRemovedLog(player, holder.page() - 1);
                  return;
              }
              if (slot == NEXT_PAGE_SLOT) {
                  openRemovedLog(player, holder.page() + 1);
                  return;
              }
          '''
          if old not in text:
              if new in text:
                  raise SystemExit(0)
              raise SystemExit('expected removed-log slot block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          if git diff --quiet; then exit 0; fi
          mvn --batch-mode --no-transfer-progress test
          git config user.name 'P2wn'
          git config user.email 'racecarboy77@gmail.com'
          git add src/main/java/org/enthusia/rep/gui/RepGuiManager.java
          git commit -m 'ES-X04: reuse GUI pagination slot constants'
          git push origin HEAD:package/es-x04-commend-provider
