name: X04 final static fix

on:
  push:
    branches:
      - package/es-x04-commend-provider

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: package/es-x04-commend-provider
          fetch-depth: 0
      - name: Replace removed-log slot literals with existing constants
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/main/java/org/enthusia/rep/gui/RepGuiManager.java')
          text = path.read_text()
          replacements = {
              '''        if (slot == 45) {\n            openRemovedLog(player, holder.page() - 1);''':
              '''        if (slot == PREVIOUS_PAGE_SLOT) {\n            openRemovedLog(player, holder.page() - 1);''',
              '''        if (slot == 53) {\n            openRemovedLog(player, holder.page() + 1);''':
              '''        if (slot == NEXT_PAGE_SLOT) {\n            openRemovedLog(player, holder.page() + 1);''',
          }
          changed = False
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new, 1)
                  changed = True
              elif new not in text:
                  raise SystemExit(f'expected GUI slot block not found: {old!r}')
          if changed:
              path.write_text(text)
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name 'P2wn'
          git config user.email 'racecarboy77@gmail.com'
          git add src/main/java/org/enthusia/rep/gui/RepGuiManager.java
          git commit -m 'ES-X04: reuse GUI pagination slot constants'
          git push origin HEAD:package/es-x04-commend-provider
