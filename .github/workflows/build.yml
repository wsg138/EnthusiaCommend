name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
  statuses: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: PMD
        run: mvn --batch-mode --no-transfer-progress org.apache.maven.plugins:maven-pmd-plugin:3.26.0:pmd
      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: EnthusiaCommend
          path: target/EnthusiaCommend-*.jar
          if-no-files-found: error
      - name: Publish exact-head success status
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --data "$(jq -n \
              --arg state success \
              --arg context 'Build and test (exact head)' \
              --arg description 'Java 21 verify, PMD, and artifact upload passed on exact push SHA' \
              --arg target_url \"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\" \
              '{state:$state,context:$context,description:$description,target_url:$target_url}')" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
