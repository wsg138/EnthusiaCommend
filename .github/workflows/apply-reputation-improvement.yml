name: Apply reputation improvement
on:
  push:
    branches: [agent/reputation-category-zones-alerts-webhook]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Apply scoped source changes
        env:
          PATCH_PAYLOAD: ""
        run: |
          python - <<'PY'
          import base64, gzip, os
          from pathlib import Path
          Path('/tmp/apply_reputation_improvement.py').write_bytes(gzip.decompress(base64.b64decode(os.environ['PATCH_PAYLOAD'])))
          PY
          python /tmp/apply_reputation_improvement.py
      - name: Verify exact final tree
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Commit verified implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Improve reputation category views and alerts"
          git push origin HEAD:agent/reputation-category-zones-alerts-webhook
