name: Apply reputation improvement
on:
  push:
    branches: [agent/reputation-category-zones-alerts-webhook]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Apply scoped source changes
        run: |
          python - <<'PY'
          import base64, gzip, re
          from pathlib import Path
          text = Path('.automation/apply-payload.yml').read_text(encoding='utf-8')
          match = re.search(r'PATCH_PAYLOAD: "([A-Za-z0-9+/=]+)"', text)
          if match is None:
              raise SystemExit('Embedded patch payload was not found')
          Path('/tmp/apply_reputation_improvement.py').write_bytes(
              gzip.decompress(base64.b64decode(match.group(1)))
          )
          PY
          python /tmp/apply_reputation_improvement.py
          rm -f .automation/apply-payload.yml .automation-trigger
          rm -f .github/workflows/source-export.yml .github/workflows/apply-reputation-improvement.yml
      - name: Verify exact final tree
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Commit verified implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Improve reputation category views and alerts"
          git push origin HEAD:agent/reputation-category-zones-alerts-webhook
