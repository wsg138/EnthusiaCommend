name: Apply atomic commendation fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'feature/rep-system-v2-mainline'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rep-system-v2-mainline
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Apply atomic snapshot correction
        run: |
          if [ -f .final-review/atomic_commendation_fix.py ]; then
            python3 .final-review/atomic_commendation_fix.py
          else
            echo "Atomic correction is already published."
          fi

      - name: Verify
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Publish verified correction
        run: |
          rm -f .final-review/atomic_commendation_fix.py
          if git diff --quiet -- \
            .final-review/atomic_commendation_fix.py \
            src/main/java/org/enthusia/rep/rep/Commendation.java \
            src/main/java/org/enthusia/rep/rep/RepService.java \
            src/test/java/org/enthusia/rep/rep/CommendationMigrationTest.java; then
            echo "No source changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            .final-review \
            src/main/java/org/enthusia/rep/rep/Commendation.java \
            src/main/java/org/enthusia/rep/rep/RepService.java \
            src/test/java/org/enthusia/rep/rep/CommendationMigrationTest.java
          git commit -m "fix: make commendation updates and snapshots atomic"
          git push origin HEAD:feature/rep-system-v2-mainline
