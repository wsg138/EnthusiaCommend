name: Apply final review corrections

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'feature/rep-system-v2-mainline'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rep-system-v2-mainline
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Apply reviewed corrections
        run: |
          if [ -f .final-review/apply_coderabbit_fixes.py ]; then
            mkdir -p src/test/java/org/enthusia/rep/config
            python3 - <<'PY'
          from pathlib import Path
          path = Path('.final-review/apply_coderabbit_fixes.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              're.subn(pattern, replacement, text, count=1, flags=re.DOTALL)',
              're.subn(pattern, lambda _match: replacement, text, count=1, flags=re.DOTALL)'
          )
          path.write_text(text, encoding='utf-8')
          PY
            python3 .final-review/apply_coderabbit_fixes.py
            rm -f .final-review/apply_coderabbit_fixes.py
          else
            echo "Corrections are already published."
          fi

      - name: Verify
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Publish verified corrections
        run: |
          if git diff --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: close final automated review findings"
          git push origin HEAD:feature/rep-system-v2-mainline
