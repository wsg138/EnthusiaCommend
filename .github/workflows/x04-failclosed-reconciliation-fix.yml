name: X04 fail-closed reconciliation fix

on:
  push:
    branches:
      - package/es-x04-commend-provider

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: package/es-x04-commend-provider
          fetch-depth: 0
      - name: Apply fail-closed reconciliation repair
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old!r}')
              path.write_text(text.replace(old, new, 1))

          api = Path('src/main/java/org/enthusia/rep/api/ReputationModerationApi.java')
          replace_once(
              api,
              '    boolean canGiveReputation(UUID playerId);\n\n    Optional<ReputationBlacklist> getBlacklist(UUID playerId);',
              '    boolean canGiveReputation(UUID playerId);\n\n'
              '    /** Fail closed while the authoritative moderation owner is reconciling this player. */\n'
              '    void markReconciliationPending(UUID playerId);\n\n'
              '    /** Clear the temporary fail-closed fence only after authoritative reconciliation settles. */\n'
              '    void clearReconciliationPending(UUID playerId);\n\n'
              '    Optional<ReputationBlacklist> getBlacklist(UUID playerId);'
          )

          service = Path('src/main/java/org/enthusia/rep/moderation/ReputationModerationService.java')
          replace_once(service, 'import java.util.LinkedHashMap;\nimport java.util.Map;',
                       'import java.util.HashSet;\nimport java.util.LinkedHashMap;\nimport java.util.Map;')
          replace_once(service, 'import java.util.Optional;\nimport java.util.UUID;',
                       'import java.util.Optional;\nimport java.util.Set;\nimport java.util.UUID;')
          replace_once(service,
              '    private final ReputationModerationStore store;\n    private final Object stateLock = new Object();\n    private ReputationModerationStore.State state;',
              '    private final ReputationModerationStore store;\n    private final Object stateLock = new Object();\n'
              '    private final Set<UUID> reconciliationPending = new HashSet<>();\n'
              '    private ReputationModerationStore.State state;')
          replace_once(service,
              '    @Override\n    public boolean canGiveReputation(UUID playerId) {\n        return !isReputationBlacklisted(playerId);\n    }\n\n    @Override\n    public Optional<ReputationBlacklist> getBlacklist(UUID playerId) {',
              '    @Override\n    public boolean canGiveReputation(UUID playerId) {\n        synchronized (stateLock) {\n'
              '            UUID requiredPlayerId = Objects.requireNonNull(playerId, PLAYER_ID_ARGUMENT);\n'
              '            return !reconciliationPending.contains(requiredPlayerId)\n'
              '                    && getBlacklistLocked(requiredPlayerId)\n'
              '                    .map(value -> !value.activeAt(clock.instant()))\n'
              '                    .orElse(true);\n'
              '        }\n'
              '    }\n\n'
              '    @Override\n'
              '    public void markReconciliationPending(UUID playerId) {\n'
              '        synchronized (stateLock) {\n'
              '            reconciliationPending.add(Objects.requireNonNull(playerId, PLAYER_ID_ARGUMENT));\n'
              '        }\n'
              '    }\n\n'
              '    @Override\n'
              '    public void clearReconciliationPending(UUID playerId) {\n'
              '        synchronized (stateLock) {\n'
              '            reconciliationPending.remove(Objects.requireNonNull(playerId, PLAYER_ID_ARGUMENT));\n'
              '        }\n'
              '    }\n\n'
              '    @Override\n'
              '    public Optional<ReputationBlacklist> getBlacklist(UUID playerId) {'
          )

          test = Path('src/test/java/org/enthusia/rep/moderation/ReputationModerationServiceTest.java')
          marker = '''    @Test
    void staleReputationAndBlacklistRevisionFailClosedWithoutMutation() {'''
          addition = '''    @Test
    void pendingAuthoritativeReconciliationFailsClosedWithoutChangingReputation() {
        AtomicReference<ReputationStateSnapshot> state = new AtomicReference<>(snapshot(7));
        ReputationModerationService service = new ReputationModerationService(
                Clock.fixed(NOW, ZoneOffset.UTC), ignored -> state.get(), temporaryDirectory.resolve(STATE_FILE));

        service.markReconciliationPending(PLAYER);
        assertFalse(service.canGiveReputation(PLAYER));
        assertTrue(service.getBlacklist(PLAYER).isEmpty());
        assertEquals(state.get(), service.snapshot(PLAYER));

        service.clearReconciliationPending(PLAYER);
        assertTrue(service.canGiveReputation(PLAYER));

        ReputationMutationResult applied = service.applyBlacklist(
                UUID.randomUUID(), PLAYER, Optional.empty(), CASE_ONE, 0L, state.get().checksum());
        assertEquals(ReputationMutationResult.Status.APPLIED, applied.status());
        service.markReconciliationPending(PLAYER);
        service.clearReconciliationPending(PLAYER);
        assertFalse(service.canGiveReputation(PLAYER));
    }

''' + marker
          replace_once(test, marker, addition)
          PY
          git rm .github/workflows/x04-failclosed-reconciliation-fix.yml
          git config user.name 'P2wn'
          git config user.email 'racecarboy77@gmail.com'
          git add src/main/java/org/enthusia/rep/api/ReputationModerationApi.java \
                  src/main/java/org/enthusia/rep/moderation/ReputationModerationService.java \
                  src/test/java/org/enthusia/rep/moderation/ReputationModerationServiceTest.java
          git commit -m 'ES-X04: fail closed during reputation reconciliation'
          git push origin HEAD:package/es-x04-commend-provider
