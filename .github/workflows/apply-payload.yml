name: Assemble implementation

on:
  push:
    branches:
      - feature/rep-system-v2-mainline
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  assemble:
    if: github.event_name == 'pull_request' || contains(github.event.head_commit.message, '[assemble]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rep-system-v2-mainline
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Assemble source tree
        run: python3 .changes/apply_payload.py

      - name: Verify assembled implementation
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: rebuild reputation system on current architecture"
          git push origin HEAD:feature/rep-system-v2-mainline
