rep:
  minActivePlaytimeHours: 12
  editCooldownHours: 24
  input:
    default: ANVIL
    maxReasonLength: 256
    timeoutSeconds: 60
  # Applies after every removal, including staff removals. Zero disables it.
  removalCooldownHours: 24
  ipProtection:
    enabled: true
    # Require both accounts to have a saved address hash (captured on login).
    requireKnownAddresses: true
  tarnished:
    hours: 24
    color: GOLD
    label: Tarnished
  recent:
    dayHours: 24
    weekHours: 168
    pageSize: 10
  effectRules:
    # Disable an effect in every scope, e.g. [stalk, redGlow].
    disabledEffects: []
    # A negative threshold activates at or below it; positive at or above it.
    # Delete rules or set enabled: false to disable. [] disables a whole scope.
    # Supported effects: teleport (multiplier), glow/redGlow/stalk (1 = on),
    # movement/potion/firework (percent), pearl/wind (extra cooldown seconds).
    # Cashback has been removed. Only the following effects run by default.
    overall:
      - {effect: teleport, threshold: -10, value: 1.4}
      - {effect: teleport, threshold: -15, value: 1.6}
      - {effect: teleport, threshold: -25, value: 2.0}
      - {effect: glow, threshold: -10, value: 1}
      - {effect: redGlow, threshold: -20, value: 1}
      - {effect: stalk, threshold: -12, value: 1}
      - {effect: teleport, threshold: 5, value: 0.8333333333333334}
      - {effect: teleport, threshold: 10, value: 0.75}
      - {effect: teleport, threshold: 15, value: 0.6666666666666666}
      - {effect: teleport, threshold: 20, value: 0.5}
    # Each category independently uses the built-in rules for its polarity.
    # To override a category, uncomment its list and add/remove rules there.
    # An empty list explicitly disables that category's effects.
    categories: {}
    # categories:
    #   SPAWN_KILLED:
    #     - {effect: glow, threshold: -10, value: 1}
    #     - {effect: stalk, threshold: -12, value: 1}
    #   WAS_KIND:
    #     - {effect: teleport, threshold: 5, value: 0.8}
    #   GOOD_STALL: []
rep-trading-alerts:
  # Applies only to operators or players granted enthusiacommend.rep.alert.
  # Authorized administrators without a saved preference inherit this value.
  enabled-by-default: true

stalk:
  costPerDay: 100.0
  maxDays: 7
storage:
  autoSaveSeconds: 60
analytics:
  retentionDays: 90
  maxRecords: 5000
integrations:
  plan:
    enabled: true
    page:
      enabled: true
discord:
  # HTTPS Discord webhook URL. Leave blank to disable commendation logging.
  webhookUrl: ""
playtime:
  primaryPlaceholder: "%playtime_active%"
  fallbackFormattedPlaceholder: "%playtime_active_formatted%"
regions:
  # Stalking-zone precedence is market, then spawn, then warzone; classification uses world and X/Z only.
  # The Y values remain in the shared cuboid syntax but are ignored by stalking transitions.
  # Exact untouched legacy spawn/warzone defaults migrate once; custom lists are preserved.
  # Missing keys, including market, are still added by the normal defaults merger.
  market:
    - world: world
      min: -72, 0, -281
      max: 102, 256, -162
  spawn:
    - world: world
      min: -48, 0, -33
      max: 69, 256, 84
  warzone:
    - world: world
      min: -218, 0, -404
      max: 219, 256, 188
